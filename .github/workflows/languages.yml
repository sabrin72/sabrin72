
name: Generate Languages Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate languages SVG
        uses: cicirello/user-statistician@v1
        with:
          image-file: languages.svg
          colors: github
          include-title: true
          max-languages: 4

      - name: Publish languages SVG
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: languages-output
          publish_files: languages.svg
